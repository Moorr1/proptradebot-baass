<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ladder settings · PropTradeBot</title>
  <script async crossorigin="anonymous"
    data-clerk-publishable-key="pk_live_Y2xlcmsucHJvcHRyYWRlYm90LmNvbSQ"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"></script>
  <script src="/js/settings_model.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
    a { color: #38bdf8; text-decoration: none; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px 24px; margin-bottom: 18px; }
    h1 { font-size: 24px; margin-bottom: 4px; } h2 { font-size: 17px; margin-bottom: 12px; }
    .muted { color: #94a3b8; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    input, select { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; padding: 8px 10px; font-size: 14px; }
    input[type=checkbox] { width: auto; }
    .stat { background: #0f172a; border-radius: 8px; padding: 12px 14px; }
    .stat .v { font-size: 22px; font-weight: 600; color: #38bdf8; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; background: #0ea5e9; color: #fff; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .err { color: #fca5a5; font-size: 13px; margin: 4px 0; } .warn { color: #fcd34d; font-size: 13px; margin: 4px 0; } .ok { color: #86efac; }
    .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #1f2a3d; font-size: 14px; }
  </style>
</head>
<body>
<div class="container">
  <p style="margin-bottom:12px;"><a href="/dashboard">← Dashboard</a></p>
  <h1>Ladder settings</h1>
  <p class="muted" style="margin-bottom:18px;">Changes apply to your next trade, never to one that's open. Anything that adds risk waits for your approval in the PropTradeBot app on your computer.</p>

  <div id="gate" class="card"><p class="muted">Loading…</p></div>

  <div id="form" style="display:none;">
    <div class="card">
      <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
        <h2 style="margin:0;">Strategy</h2><span id="running" class="muted"></span>
      </div>
      <div class="grid"><div><label for="preset">Preset</label>
        <select id="preset"><option value="">Custom</option><option value="mes511">MES 5-1-1 (7 contracts)</option><option value="mes111">MES 1-1-1 (3 contracts)</option><option value="mnq311">MNQ 3-1-1 (5 contracts)</option></select></div></div>
      <div id="legs"></div>
    </div>

    <div class="card">
      <h2>Accounts and safety</h2>
      <div id="accounts"></div>
      <div class="grid" style="margin-top:12px;">
        <div><label><input type="checkbox" id="ladder"> Broker ladder (targets sit at the broker)</label></div>
        <div><label><input type="checkbox" id="eodOn" disabled> EOD flatten (set in the app)</label></div>
        <div><label for="eodTime">EOD flatten time (ET, 12:00–16:59)</label><input id="eodTime" type="time" min="12:00" max="16:59"></div>
      </div>
    </div>

    <div class="card">
      <div class="grid">
        <div class="stat"><div class="muted">Risk per account</div><div class="v" id="rA">$0</div></div>
        <div class="stat"><div class="muted">Risk across accounts</div><div class="v" id="rT">$0</div></div>
        <div class="stat"><div class="muted">Enabled accounts</div><div class="v" id="nA">0</div></div>
      </div>
      <div id="problems"></div>
      <div id="riskNote"></div>
      <div style="display:flex; gap:12px; align-items:center; margin-top:12px;">
        <button class="btn" id="save">Save changes</button>
        <span id="saveMsg" class="muted"></span>
      </div>
    </div>

    <div class="card"><h2>History</h2><div id="history" class="muted"></div></div>
  </div>
</div>

<script>
  const M = window.PTBSettings;
  const PRESETS = {
    mes511: { sp: { instrument: 'MES', contracts: 7, stop: 11, stop_after_t1: 4, t1_contracts: 5, t1_points: 4.5, t2_contracts: 1, t2_points: 11, runner_contracts: 1, runner_close: 20 } },
    mes111: { sp: { instrument: 'MES', contracts: 3, stop: 9, stop_after_t1: 7, t1_contracts: 1, t1_points: 7, t2_contracts: 1, t2_points: 12, runner_contracts: 1, runner_close: 20 } },
    mnq311: { nq: { instrument: 'MNQ', contracts: 5, stop: 35, stop_after_t1: 35, t1_contracts: 3, t1_points: 20, t2_contracts: 1, t2_points: 40, runner_contracts: 1, runner_close: 60 } },
  };
  const FIELDS = [['contracts', 'Contracts (0 = off)', 1], ['stop', 'Initial stop (pts)', 0.25], ['stop_after_t1', 'Stop after T1 (pts)', 0.25],
    ['t1_contracts', 'T1 contracts', 1], ['t1_points', 'T1 target (pts)', 0.25], ['t2_contracts', 'T2 contracts', 1],
    ['t2_points', 'T2 target (pts)', 0.25], ['runner_contracts', 'Runner contracts', 1], ['runner_close', 'Runner close (pts)', 0.25]];
  const LEGS = { sp: ['S&P leg', ['MES', 'ES']], nq: ['Nasdaq leg', ['MNQ', 'NQ']] };
  let base = null, baseVersion = 0, form = null, runningSettings = null;
  const $ = (id) => document.getElementById(id);
  const money = (x) => '$' + Math.round(x).toLocaleString();
  const text = (el, t, cls) => { const d = document.createElement('div'); d.textContent = t; if (cls) d.className = cls; el.appendChild(d); return d; };

  async function api(path, opts = {}) {
    const token = await Clerk.session.getToken();
    const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` } });
    return { status: r.status, body: await r.json().catch(() => ({})) };
  }

  function buildLegs() {
    const host = $('legs'); host.textContent = '';
    for (const k of ['sp', 'nq']) {
      const [name, insts] = LEGS[k];
      const h = document.createElement('h2'); h.textContent = name; h.style.marginTop = '8px'; host.appendChild(h);
      const g = document.createElement('div'); g.className = 'grid'; host.appendChild(g);
      const w = document.createElement('div'); w.innerHTML = `<label for="${k}_instrument">Instrument</label>`;
      const sel = document.createElement('select'); sel.id = `${k}_instrument`; sel.disabled = true;
      sel.title = 'Switching between micro and full-size contracts is done in the app on your computer.';
      insts.forEach((i) => { const o = document.createElement('option'); o.value = i; o.textContent = `${i} ($${M.POINT_VALUE[i]}/pt)`; sel.appendChild(o); });
      w.appendChild(sel); g.appendChild(w);
      for (const [f, lbl, step] of FIELDS) {
        const d = document.createElement('div'); d.innerHTML = `<label for="${k}_${f}">${lbl}</label>`;
        const inp = document.createElement('input'); inp.type = 'number'; inp.min = '0'; inp.step = String(step); inp.id = `${k}_${f}`;
        d.appendChild(inp); g.appendChild(d);
      }
    }
    document.querySelectorAll('#form input, #form select').forEach((el) => el.addEventListener('input', () => { if (el.id !== 'preset') $('preset').value = ''; refresh(); }));
  }

  function fill(s) {
    for (const k of ['sp', 'nq']) {
      $(`${k}_instrument`).value = s.legs[k].instrument;
      for (const [f] of FIELDS) $(`${k}_${f}`).value = s.legs[k][f];
    }
    $('ladder').checked = !!s.broker_ladder; $('eodOn').checked = !!s.eod.enabled; $('eodTime').value = s.eod.time;
    const acc = $('accounts'); acc.textContent = '';
    s.accounts.forEach((a, i) => {
      const row = document.createElement('label'); row.className = 'row';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = a.enabled; cb.id = `acc_${i}`; cb.addEventListener('input', refresh);
      const span = document.createElement('span');
      span.textContent = (a.label || a.ref) + (a.leader ? ' · leader' : '') + (a.follower ? ' · follower' : '');
      row.append(cb, span); acc.appendChild(row);
    });
    text(acc, 'Accounts are added or removed in the app on your computer.', 'muted');
  }

  function read() {
    const s = JSON.parse(JSON.stringify(base));
    for (const k of ['sp', 'nq']) {
      s.legs[k].instrument = $(`${k}_instrument`).value;
      for (const [f, , step] of FIELDS) { const v = $(`${k}_${f}`).value; s.legs[k][f] = v === '' ? NaN : (step === 1 ? Number(v) : parseFloat(v)); }
    }
    s.broker_ladder = $('ladder').checked; s.eod = { enabled: $('eodOn').checked, time: $('eodTime').value };
    s.accounts = base.accounts.map((a, i) => ({ ...a, enabled: $(`acc_${i}`).checked }));
    return s;
  }

  function refresh() {
    form = read();
    const judge = runningSettings || base;          // what the computer is actually running
    const errs = M.validate(form, { knownRefs: base.accounts.map((a) => a.ref) }).concat(M.lockedChanges(judge, form));
    const p = $('problems'); p.textContent = '';
    errs.forEach((e) => text(p, '⚠ ' + e, 'err'));
    ['sp', 'nq'].forEach((k) => { if (['ES', 'NQ'].includes(form.legs[k].instrument) && form.legs[k].contracts > 0) text(p, `⚠ ${form.legs[k].instrument} is full size: ten times the money per point of the micro.`, 'warn'); });
    if (!errs.length) {
      const t = M.totalRisk(form);
      $('rA').textContent = money(t.perAccount); $('rT').textContent = money(t.total); $('nA').textContent = t.accounts;
      const r = M.riskIncrease(judge, form), note = $('riskNote'); note.textContent = '';
      const d = M.diff(judge, form);
      if (d.length) { text(note, 'Changes from what your computer is running:', 'muted'); d.forEach((x) => text(note, '• ' + x, 'muted')); }
      if (r.length) { text(note, 'These add risk, so the app on your computer will ask you to approve them:', 'warn'); r.forEach((x) => text(note, '• ' + x, 'warn')); }
    }
    $('save').disabled = errs.length > 0;
  }

  $('preset').addEventListener('change', (e) => {
    const pr = PRESETS[e.target.value]; if (!pr) return;
    const s = read();
    for (const k of ['sp', 'nq']) {
      if (pr[k]) s.legs[k] = { ...pr[k] };
      else Object.assign(s.legs[k], { contracts: 0, t1_contracts: 0, t2_contracts: 0, runner_contracts: 0 });
    }
    fill(s); refresh(); $('preset').value = e.target.value;
  });

  function showRunning(cur, running) {
    const el = $('running');
    if (!running) { el.textContent = 'Your app hasn\'t reported yet.'; el.className = 'muted'; return; }
    const v = running.running, st = running.state;
    if (st === 'needs_approval') { el.textContent = `Version ${running.pending} is waiting for your approval in the app on your computer.`; el.className = 'warn'; }
    else if (st === 'queued') { el.textContent = `Version ${running.pending} is queued: it applies when your current trade closes.`; el.className = 'warn'; }
    else if (st === 'rejected') { el.textContent = `Version ${running.pending} was rejected by your app: ${running.reason || ''}`; el.className = 'err'; }
    else if (v === cur.version) { el.textContent = `✓ Version ${v} is running on your computer${running.applied_at ? ' (applied ' + new Date(running.applied_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ')' : ''}.`; el.className = 'ok'; }
    else { el.textContent = `Your computer runs version ${v}. Version ${cur.version} will apply shortly.`; el.className = 'muted'; }
  }

  function showHistory(h) {
    const el = $('history'); el.textContent = '';
    h.forEach((x) => text(el, `v${x.version} · ${new Date(x.created_at).toLocaleString()} · from ${x.source === 'app' ? 'the app' : 'the website'}${(x.risk_reasons || []).length ? ' · needed approval' : ''}`));
  }

  async function load() {
    const { body } = await api('/api/user/settings');
    if (!body.success) { $('gate').textContent = body.error || 'Could not load your settings.'; return; }
    if (!body.current) {
      $('gate').innerHTML = '';
      text($('gate'), 'Your app hasn\'t shared its settings yet.');
      text($('gate'), 'Open PropTradeBot 1.8 or later on your computer and sign in with your licence key. Your current settings will appear here within a minute.', 'muted');
      return;
    }
    $('gate').style.display = 'none'; $('form').style.display = 'block';
    if (!base || body.current.version !== baseVersion) { base = body.current.settings; baseVersion = body.current.version; buildLegs(); fill(base); refresh(); }
    runningSettings = body.running && body.running.settings ? body.running.settings : null;
    showRunning(body.current, body.running); showHistory(body.history || []); refresh();
  }

  $('save').addEventListener('click', async () => {
    refresh(); if ($('save').disabled) return;
    $('save').disabled = true; $('saveMsg').textContent = 'Saving…'; $('saveMsg').className = 'muted';
    const { status, body } = await api('/api/user/settings', { method: 'POST', body: JSON.stringify({ settings: form, base_version: baseVersion }) });
    if (body.success) {
      $('saveMsg').textContent = body.needs_approval ? `Saved as version ${body.version}. Approve it in the app on your computer.` : `Saved as version ${body.version}. Waiting for your computer to apply it…`;
      $('saveMsg').className = body.needs_approval ? 'warn' : 'ok';
      base = null; await load();
    } else {
      $('saveMsg').textContent = (body.errors && body.errors.join(' ')) || body.error || `Could not save (${status}).`;
      $('saveMsg').className = 'err'; $('save').disabled = false;
    }
  });

  window.addEventListener('load', async () => {
    await Clerk.load();
    if (!Clerk.user) { location.href = '/dashboard'; return; }
    await load();
    setInterval(() => { if (!document.hidden) load(); }, 10000);
  });
</script>
</body>
</html>
